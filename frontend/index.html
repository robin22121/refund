<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1546b8">
  <title>양도세 환급 무료 진단</title>
  <meta name="description" content="내가 낸 양도소득세, 돌려받을 수 있는지 3분 만에 무료로 확인하세요.">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button type="button" class="back" id="back" aria-label="이전 화면">‹ 이전</button>
    <span class="brand">세금 돌려받기</span>
    <button type="button" class="help-btn" id="help-btn" aria-haspopup="dialog">도움말</button>
  </header>
  <div class="progress" id="progress" hidden>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div class="progress-label" id="progress-label"></div>
  </div>
  <main id="app" tabindex="-1"></main>
  <div class="sheet-backdrop" id="sheet-backdrop" hidden></div>
  <section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title" hidden>
    <div class="sheet-head">
      <h2 id="sheet-title">자주 묻는 질문</h2>
      <button type="button" class="linkbtn" id="sheet-close">닫기</button>
    </div>
    <div id="sheet-body"></div>
  </section>
  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
  <script src="app.js"></script>
</body>
</html>
